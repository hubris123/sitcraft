<style>html,body{margin:0;height:100%;background:#0f1013;color:#ecebe8;font-family:Geist,system-ui,sans-serif;-webkit-text-size-adjust:100%}#app{height:100%}
#sc-loading{position:fixed;inset:0;display:grid;place-items:center;font-size:15px;color:#8d9098}
/* SitCraft on the iPad is landscape only: held upright, the screens are covered with a "turn sideways" note */
#sc-turn{display:none}
@media (orientation: portrait) and (max-width: 1100px){
  #sc-turn{display:flex;position:fixed;inset:0;z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0f1013;color:#ecebe8;text-align:center;padding:24px}
  #sc-turn svg{width:96px;height:96px}
  #sc-turn b{font-size:22px;font-weight:600}#sc-turn span{font-size:15px;color:#9a9ca3;max-width:360px;line-height:1.5}
}</style>
</head>
<body>
<div id="app"><div id="sc-loading">Opening SitCraft…</div></div>
<div id="sc-turn" role="alert"><svg viewBox="0 0 96 96" fill="none" stroke="#ecebe8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="14" width="36" height="56" rx="6" opacity=".35"/><rect x="14" y="40" width="68" height="44" rx="6"/><path d="M72 22c8 3 12 9 12 16"/><path d="M80 36l4 4 4-6"/></svg><b>Turn your iPad sideways</b><span>SitCraft is designed for landscape. Your work is safe — it’s right where you left it.</span></div>

<script src="screens.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="web/start.js"></script>
</body>
</html>
